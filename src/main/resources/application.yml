server:
  servlet:
    context-path: /tenants
  port: 8080

spring:
  application:
    name: ms-sgl-tenant-service-v1

  datasource:
    url: jdbc:postgresql://${host:sgl-db-v1.crg4kaqsg4x2.us-east-2.rds.amazonaws.com}:${port:5432}/sgl_tenant_db
    username: ${sgl_user}
    password: ${sgl_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    default-schema: public

  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-2}
      credentials:
        instance-profile: false
      parameterstore:
        enabled: false
      secretsmanager:
        enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.sgl.tenant: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

