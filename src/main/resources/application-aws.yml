# Profile AWS - As credenciais e endpoint do RDS são buscados via AWS Secrets Manager
# O Spring Cloud AWS injeta automaticamente as propriedades do path configurado.

spring:
  config:
    import:
      - "aws-secretsmanager:secret-sgl-db-credentials-v1"

  cloud:
    aws:
      region:
        static: us-east-2
      secretsmanager:
        region: us-east-2

  datasource:
    url: jdbc:postgresql://${host:localhost}:${port:5432}/sgl_tenant_db
    username: ${username:user}
    password: ${password:pass}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: false

  flyway:
    enabled: true

logging:
  level:
    com.sgl.tenant: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
