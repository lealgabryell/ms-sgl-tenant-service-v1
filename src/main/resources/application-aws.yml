# Profile AWS - As credenciais e endpoint do RDS são buscados via AWS Secrets Manager
# O Spring Cloud AWS injeta automaticamente as propriedades do path configurado.

spring:
  config:
    import:
      - "aws-secretsmanager:/sgl/tenant-service/rds-credentials"
      - "aws-parameterstore:/sgl/tenant-service/"

  datasource:
    url: jdbc:postgresql://${rds.host}:${rds.port}/${rds.dbname}
    username: ${rds.username}
    password: ${rds.password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: false

  flyway:
    enabled: true

  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        instance-profile: true
      parameterstore:
        enabled: true
      secretsmanager:
        enabled: true

logging:
  level:
    com.sgl.tenant: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

